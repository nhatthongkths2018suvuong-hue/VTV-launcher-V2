<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, user-scalable=no">
<title>VTV Launcher</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="gridView">
  <div id="wall"></div>
  <div id="shade"></div>
  <div id="clockbar">
    <div id="clock">
      <div id="time">--:--</div>
      <div id="date">Dương lịch: --/--/----</div>
      <div id="lunar1" class="lunar"></div>
      <div id="lunar2" class="lunar"></div>
    </div>
    <div class="ibtn" id="tSource">
      <svg viewBox="0 0 24 24"><path d="M21 3.01H3c-1.1 0-2 .9-2 2V9h2V4.99h18v14.03H3V15H1v4.01c0 1.1.9 1.98 2 1.98h18c1.1 0 2-.88 2-1.98v-14c0-1.11-.9-2-2-2zM11 16l4-4-4-4v3H1v2h10v3z"/></svg>
    </div>
    <div class="ibtn" id="tSettings">
      <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
    </div>
    <div class="ibtn" id="tApps">
      <svg viewBox="0 0 24 24"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/></svg>
    </div>
  </div>
  <div id="quickRow" class="row"></div>
  <div id="chanRow" class="row"></div>
</div>
<div id="playerView" style="display:none">
  <video id="video" autoplay></video>
  <div id="osd"></div>
  <div id="msg"></div>
  <div id="ctl"><button id="bPrev">&#9664; Kênh trước</button><button id="bList">&#9776; Danh sách</button><button id="bNext">Kênh sau &#9654;</button></div>
</div>
<div id="srcOverlay" style="display:none">
  <div id="srcBox">
    <div id="srcTitle">Chọn nguồn tín hiệu</div>
    <div id="srcList"></div>
    <div id="srcHint">&#9650;&#9660; chọn &nbsp;·&nbsp; OK chuyển nguồn &nbsp;·&nbsp; Back đóng<br>Nếu OK không chuyển được: bấm &#9654; để xem ngay trong launcher</div>
  </div>
</div>
<div id="numOsd"></div>
<script src="app.js"></script>
</body>
</html>
